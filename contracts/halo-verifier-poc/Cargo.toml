[package]
name = "halo-verifier-poc"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.89.0"

# Day-1 de-risk verifier: a generic BN254 Groth16 verifier, hand-ported from the
# merged on-main `stellar/soroban-examples/groth16_verifier` (BLS12-381) by swapping
# the curve module to `crypto::bn254`. Cross-checked byte-for-byte against
# PR #399 (jayz22/soroban-examples@add-bn254-groth16). soroban-sdk pinned to 25.0.2
# to match that reference exactly.

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "25.0.2" }

[dev-dependencies]
soroban-sdk = { version = "25.0.2", features = ["testutils"] }
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-serialize = "0.5.0"
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[package]
name = "halo-verifier"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.92.0"

# The Halo verifier: embeds the circuit VK, manages the trusted issuer root, verifies
# a BN254 Groth16 proof on-chain, binds it to the caller, enforces a per-scope
# nullifier (Sybil resistance), stores an attestation, and exposes is_verified.

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "25.0.2" }

[dev-dependencies]
soroban-sdk = { version = "25.0.2", features = ["testutils"] }
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
